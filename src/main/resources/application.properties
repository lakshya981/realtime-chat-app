server.port=8080
spring.application.name=realtime-chat-app

# --- H2 in-memory database (data resets on restart; swap to MySQL/Postgres for real persistence) ---
spring.datasource.url=jdbc:h2:mem:chatdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Twilio SMS notifications (disabled by default) ---
# Set twilio.enabled=true and fill these in from your Twilio Console (free trial account)
# to enable offline SMS alerts. Get a trial account at https://www.twilio.com/try-twilio
twilio.enabled=false
twilio.account-sid=YOUR_ACCOUNT_SID
twilio.auth-token=YOUR_AUTH_TOKEN
twilio.from-number=YOUR_TWILIO_PHONE_NUMBER
